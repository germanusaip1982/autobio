<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40 Things We Love</title>
<meta name="description" content="40 things we love about you — from family and friends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f7ef;
    --bg-2: #e6efdd;
    --card: #ffffffb3;
    --ink: #1f2d1c;
    --muted: #55684f;
    --accent: #2f6b2a;
    --accent-2: #a8322d;      /* cricket-ball red, echoing the frame's title */
    --line: #cfdcc4;
    --mark: #2f6b2a;          /* watermark colour */
    --mark-opacity: .13;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a0e; --bg-2: #142313; --card: #1a2a18b3; --ink: #e4eedd;
      --muted: #a3b89a; --accent: #8fcf7f; --accent-2: #e7746c; --line: #2c4228;
      --mark: #8fcf7f; --mark-opacity: .07;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a0e; --bg-2: #142313; --card: #1a2a18b3; --ink: #e4eedd;
    --muted: #a3b89a; --accent: #8fcf7f; --accent-2: #e7746c; --line: #2c4228;
    --mark: #8fcf7f; --mark-opacity: .07;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(ellipse at top, var(--bg) 0%, var(--bg-2) 100%) fixed;
    background-color: var(--bg);
    color: var(--ink);
    font-family: "Lora", Georgia, serif;
    line-height: 1.55;
    min-height: 100vh;
  }

  /* ---------- Watermark: cricket ground, stumps, bat & ball, greenery ---------- */
  .watermark {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    display: grid; place-items: center;
    color: var(--mark); opacity: var(--mark-opacity);
  }
  .watermark svg { width: min(120vw, 1100px); height: auto; }

  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 56px 16px 64px; }

  header { text-align: center; margin-bottom: 40px; }
  .eyebrow {
    font-family: "Caveat", cursive; font-size: 1.6rem; color: var(--muted); margin: 0;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif; font-weight: 900;
    font-size: clamp(2.2rem, 7vw, 4.2rem); line-height: 1.05; margin: 6px 0 14px;
  }
  h1 .num { color: var(--accent-2); }
  .sub { color: var(--muted); max-width: 560px; margin: 0 auto; }
  .divider { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 22px 0 0; color: var(--accent); }
  .divider::before, .divider::after { content: ""; height: 1px; width: 80px; background: var(--line); }

  .grid {
    list-style: none; padding: 0; margin: 0;
    column-width: 300px; column-gap: 18px;
  }
  .card {
    position: relative;
    display: inline-block; width: 100%;
    break-inside: avoid; margin: 14px 0 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 20px 18px 20px;
    backdrop-filter: blur(2px);
    box-shadow: 0 1px 2px #0000000d, 0 6px 20px -12px #2f6b2a40;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px #0000000f, 0 12px 28px -14px #2f6b2a66; }
  .card .n {
    position: absolute; top: -12px; left: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-2); color: #fff;
    font: 700 .85rem/1 "Playfair Display", serif;
    box-shadow: inset 0 0 0 2px #ffffff55;   /* a little seam, like a ball */
  }
  .part + .part { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .part p { margin: 6px 0 4px; font-size: 1.02rem; }
  .by {
    font-family: "Caveat", cursive; font-weight: 700;
    font-size: 1.35rem; color: var(--accent); line-height: 1.1;
  }
  .by::before { content: "— "; }

  .original { margin-top: 56px; text-align: center; }
  .original h2 { font-family: "Playfair Display", serif; font-size: 1.6rem; margin: 0 0 6px; }
  .original p { color: var(--muted); margin: 0 0 18px; }
  .original img {
    max-width: 100%; width: 560px; height: auto; border-radius: 6px;
    border: 10px solid #3b2a1e; box-shadow: 0 14px 40px -18px #000a;
  }
  footer { text-align: center; color: var(--muted); font-family: "Caveat", cursive; font-size: 1.4rem; margin-top: 40px; }
</style>
</head>
<body>

<div class="watermark" aria-hidden="true">
  <svg viewBox="0 0 1000 1000" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- boundary rope and inner circle -->
    <ellipse cx="500" cy="500" rx="470" ry="400" stroke-dasharray="2 18" stroke-width="8"/>
    <ellipse cx="500" cy="500" rx="300" ry="250" stroke-dasharray="14 14"/>
    <!-- pitch -->
    <rect x="455" y="300" width="90" height="400" rx="6" fill="currentColor" fill-opacity=".25"/>
    <line x1="440" y1="345" x2="560" y2="345"/><line x1="440" y1="655" x2="560" y2="655"/>
    <!-- stumps + bails, both ends -->
    <g fill="currentColor" stroke="none">
      <rect x="484" y="300" width="6" height="40" rx="2"/><rect x="497" y="300" width="6" height="40" rx="2"/><rect x="510" y="300" width="6" height="40" rx="2"/>
      <rect x="482" y="295" width="17" height="4" rx="2"/><rect x="501" y="295" width="17" height="4" rx="2"/>
      <rect x="484" y="660" width="6" height="40" rx="2"/><rect x="497" y="660" width="6" height="40" rx="2"/><rect x="510" y="660" width="6" height="40" rx="2"/>
      <rect x="482" y="655" width="17" height="4" rx="2"/><rect x="501" y="655" width="17" height="4" rx="2"/>
    </g>
    <!-- bat -->
    <g transform="translate(700 470) rotate(35)">
      <rect x="-8" y="-150" width="16" height="70" rx="6"/>
      <path d="M-26 -80 h52 v190 q0 22 -26 26 q-26 -4 -26 -26 z" fill="currentColor" fill-opacity=".2"/>
      <line x1="-4" y1="-140" x2="4" y2="-132"/><line x1="-4" y1="-125" x2="4" y2="-117"/><line x1="-4" y1="-110" x2="4" y2="-102"/>
    </g>
    <!-- ball with seam -->
    <g transform="translate(770 640)">
      <circle r="28" fill="currentColor" fill-opacity=".25"/>
      <path d="M-20 -19 q14 19 0 38 M20 -19 q-14 19 0 38" stroke-dasharray="3 5"/>
    </g>
    <!-- trees along the boundary -->
    <g fill="currentColor" fill-opacity=".3">
      <g transform="translate(150 230)"><circle cy="-40" r="48"/><circle cx="-34" cy="-10" r="34"/><circle cx="34" cy="-10" r="34"/><rect x="-6" y="0" width="12" height="60" rx="3"/></g>
      <g transform="translate(860 230) scale(.85)"><circle cy="-40" r="48"/><circle cx="-34" cy="-10" r="34"/><circle cx="34" cy="-10" r="34"/><rect x="-6" y="0" width="12" height="60" rx="3"/></g>
      <g transform="translate(130 800) scale(.9)"><path d="M0 -110 L55 -10 H-55 Z M0 -70 L65 30 H-65 Z"/><rect x="-6" y="30" width="12" height="40" rx="3"/></g>
      <g transform="translate(880 790) scale(.75)"><path d="M0 -110 L55 -10 H-55 Z M0 -70 L65 30 H-65 Z"/><rect x="-6" y="30" width="12" height="40" rx="3"/></g>
    </g>
    <!-- leaves -->
    <g fill="currentColor" fill-opacity=".35">
      <path d="M260 470 q40 -60 100 -40 q-30 60 -100 40 z M260 470 l90 -35"/>
      <path d="M300 640 q30 -55 90 -45 q-25 55 -90 45 z M300 640 l80 -40"/>
      <path d="M560 160 q40 -50 95 -30 q-30 55 -95 30 z M560 160 l85 -25"/>
      <path d="M380 860 q45 -45 95 -20 q-35 50 -95 20 z M380 860 l85 -18"/>
    </g>
    <!-- grass tufts -->
    <path d="M60 520 l10 -30 l10 30 l10 -24 l10 24 M920 520 l10 -30 l10 30 l10 -24 l10 24 M470 960 l10 -30 l10 30 l10 -24 l10 24 M480 70 l10 -30 l10 30 l10 -24 l10 24"/>
  </svg>
</div>

<main>
  <header>
    <p class="eyebrow">from family &amp; friends</p>
    <h1><span class="num">40</span> Things we love about you</h1>
    <p class="sub">Every line below was written by someone who loves you — collected, framed, and now here for good.</p>
    <div class="divider" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2"><circle cx="17" cy="17" r="13"/><path d="M8 8 q7 9 0 18 M26 8 q-7 9 0 18" stroke-dasharray="2 3"/></svg>
    </div>
  </header>

  <ol class="grid" id="list"></ol>

  <section class="original">
    <h2>The original frame</h2>
    <p>Where it all started.</p>
    <img src="Image.jpg" alt="The framed '40 Things we love about you' tribute" loading="lazy">
  </section>

  <footer>With love, always.</footer>
</main>

<script>
  // Each tribute is a list of [comment, author(s)] parts, transcribed as printed on the frame.
  const tributes = [
    [["The way you narrate anecdotes from your childhood", "Raja"]],
    [["Sharp shooter with air gun and catapult", "Rex, Leo"]],
    [["Best at understanding things and provides solutions to problems", "Moni, Raja"]],
    [["Expert at making catapults even with oxygen tubes", "Rex"],
     ["Or were they urine catheters from Jayaprakash Lodge area", "Richard"]],
    [["Enakku pudikkum Sham’a, avalothaan", "Angya"]],
    [["You are the best decision I made blindly", "Betsie"]],
    [["Admire your quick wit with movie dialogues according to the situation", "Raja"]],
    [["Fun, carefree, easy going, coolest and best Brother-in-Law and the bright spot in this crazy family", "Bhabi"]],
    [["Chennaiku thala Dhoni Phoenixku thala Thomi. Breathes cricket", "Sharon, Ashwin"],
     ["Sincereity in his game", "Kavitha, Bala"],
     ["All bets are off when he plays", "Abhi"]],
    [["Flying the kites is ok but we don’t let anyone fly kites on our land", "Richard"],
     ["Loves to make kite", "Leo"]],
    [["His honesty towards everything", "Kishan"],
     ["Speaks out wherever right or wrong", "Moni"],
     ["Straightforward. Nyathirkaaga nikkurathu", "Kavitha, Bala"]],
    [["What a sports star he is. Miss Carrom and TT with you", "Shruthi"]],
    [["Giving galeej galis when fielders drop catches", "Kishan"]],
    [["Very sportive even when he’s made fun of", "Judi Athai"],
     ["Easy going", "Kavitha, Bala"]],
    [["Great companion for drinking, sharing stories and singing Illaiyaraja songs (and old songs with full lyrics)", "Abhi, Raja"],
     ["…and dancing too", "Partha"]],
    [["His drunk Sunny Leone dance moves and Shivaji Nagar Kannada", "Kishan"]],
    [["Wrestling with friends on the pullu medu", "Leo, Richard"]],
    [["Goes out of his way to help others", "Sharon, Ashwin"]],
    [["From teaching the big brother to smoke (Berkley and Burton) to Lamb’s rock action movie final take which took a hit on your nose", "Richard"]],
    [["Sathamey illama nakkal adikkarathu", "Kavitha, Bala"],
     ["His sense of humour and silent nakkal", "Ancy"]],
    [["He is a good person and the best dad anyone can get", "Ian"]],
    [["Values humanity over money; knows people’s needs and helps without being asked", "Benjamin mama"]],
    [["A fantastic mentor", "Abhi"]],
    [["Yengal paasa unarvugalai purindhu, paasathai pozhiyum porumaisaali pokkisham", "Mummy"]],
    [["Loves traditional food over fancy ones", "Kavitha, Bala"]],
    [["Very competitive and ready to learn", "Kishan"]],
    [["Sitting on the pear tree near Teacher’s for hours with you", "Rex"]],
    [["One can count on you for anything and never have to think twice to approach you", "Abhi, Partha, Shruthi"]],
    [["You making fun over the non-fact that I’m vertically challenged", "Betsie"]],
    [["A good son, loving husband and caring father and soft person", "Meenu aunty"]],
    [["Very shy but tries to be bold to talk to girls", "Kishan"]],
    [["Annathae aadurar got a new flavor with our tappings and shakings", "Partha"]],
    [["Always my 2am friend", "Shruthi"]],
    [["Mugam konaathu, aduthavarai partri paesaathu, kurai kooraathu, nalla panbulla paiyyan", "Judi athai"]],
    [["The loving dad who does everything for my sake", "Ryan"]],
    [["Never greedy nor money minded", "Rita athai"]],
    [["Tried to kidnap a monkey together, so it would work for us", "Leo, Richard"]],
    [["My hiking buddy who has always pushed me ahead", "Partha"]],
    [["Partner in crime for sutta pazam from Gandhi Sons, Eeappa’s land, Joe’s land, Sindraj uncles land, carrots and plantain bunch from Brooke house, crackers from Bhai’s store, rose cuttings from nurseries, punctured balls from hostel, chicken from Kuruttu Susai’s land, apples from Missi’s, library during vacation, chocolate from Laxmi Narayan stores, Jeffery etta store, Nicholson cooperative store and the list goes on", "Richard"]],
    [["Most loveable brother", "Moni"],
     ["I am ready to live another lifetime doing all this but this time I will be your little brother", "Richard"]],
  ];

  const list = document.getElementById("list");
  tributes.forEach((parts, i) => {
    const li = document.createElement("li");
    li.className = "card";
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = i + 1;
    li.appendChild(n);
    parts.forEach(([text, by]) => {
      const part = document.createElement("div");
      part.className = "part";
      const p = document.createElement("p");
      p.textContent = text;
      const b = document.createElement("div");
      b.className = "by";
      b.textContent = by;
      part.append(p, b);
      li.appendChild(part);
    });
    list.appendChild(li);
  });
</script>
</body>
</html>
